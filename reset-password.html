<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Réinitialiser le mot de passe — Greg Promo CMS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
<main class="admin-shell">
  <section class="admin-login-card">
    <p class="eyebrow">Greg Promo CMS</p>
    <h1>Nouveau mot de passe</h1>
    <p class="admin-note">Choisissez un mot de passe unique d’au moins 12 caractères.</p>
    <form id="reset-form" class="admin-grid">
      <div class="admin-field full"><label for="new-password">Nouveau mot de passe</label><input id="new-password" type="password" minlength="12" autocomplete="new-password" required></div>
      <div class="admin-field full"><label for="confirm-password">Confirmer le mot de passe</label><input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required></div>
      <div class="admin-actions full"><button class="admin-btn primary" type="submit">Mettre à jour</button></div>
      <p id="reset-message" class="admin-note full" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-data.js"></script>
<script>
'use strict';
const cfg = window.GP_SITE?.supabase;
const message = document.querySelector('#reset-message');
if (!cfg?.url || !cfg?.anonKey || !window.supabase) {
  message.textContent = 'Configuration indisponible.';
} else {
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  document.querySelector('#reset-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.querySelector('#new-password').value;
    const confirmation = document.querySelector('#confirm-password').value;
    if (password !== confirmation) { message.textContent = 'Les mots de passe ne correspondent pas.'; return; }
    if (password.length < 12) { message.textContent = 'Utilisez au moins 12 caractères.'; return; }
    message.textContent = 'Mise à jour…';
    const { error } = await sb.auth.updateUser({ password });
    if (error) { message.textContent = error.message; return; }
    await sb.auth.signOut();
    message.textContent = 'Mot de passe mis à jour. Redirection…';
    setTimeout(() => location.replace('admin.html'), 1200);
  });
}
</script>
</body>
</html>
