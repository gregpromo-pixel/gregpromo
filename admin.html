<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Greg Promo CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
<main class="admin-shell">
  <section id="auth-card" class="admin-login-card">
    <p class="eyebrow">Greg Promo CMS</p>
    <h1>Administration</h1>
    <p class="admin-note">Accès réservé aux administrateurs autorisés.</p>
    <form id="auth-form" class="admin-grid" autocomplete="on">
      <div class="admin-field full">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" value="contact@gregpromoht.com" autocomplete="username" required>
      </div>
      <div class="admin-field full">
        <label for="auth-password">Mot de passe</label>
        <input id="auth-password" type="password" minlength="8" autocomplete="current-password" required>
      </div>
      <div class="admin-actions full">
        <button class="admin-btn primary" type="submit">Connexion</button>
        <button class="admin-btn link-btn" type="button" id="forgot-password-btn">Mot de passe oublié ?</button>
      </div>
      <p id="auth-message" class="admin-note full" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="dashboard" class="admin-hidden">
    <div class="admin-top">
      <div><p class="eyebrow">Greg Promo CMS</p><h1>Contenu du site</h1></div>
      <button id="logout-btn" class="admin-btn">Déconnexion</button>
    </div>

    <div class="admin-tabs" role="tablist">
      <button class="admin-tab active" data-tab="articles" type="button">Articles</button>
      <button class="admin-tab" data-tab="events" type="button">Événements</button>
      <button class="admin-tab" data-tab="editions" type="button">Éditions & photos</button>
    </div>

    <section class="admin-panel" data-pane="articles">
      <div class="admin-top"><h2>Articles</h2><button class="admin-btn primary" id="new-article" type="button">Nouvel article</button></div>
      <form id="article-form" class="admin-grid admin-hidden">
        <input type="hidden" id="article-id">
        <div class="admin-field"><label for="article-title-fr">Titre français</label><input id="article-title-fr" maxlength="220" required></div>
        <div class="admin-field"><label for="article-title-en">English title</label><input id="article-title-en" maxlength="220"></div>
        <div class="admin-field"><label for="article-author">Nom de l’auteur</label><input id="article-author" maxlength="120" value="Greg Promo" required></div>
        <div class="admin-field"><label for="article-category">Catégorie</label><input id="article-category" maxlength="80" value="culture"></div>
        <div class="admin-field full"><label for="article-slug">Slug</label><input id="article-slug" maxlength="220" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></div>
        <div class="admin-field"><label for="article-summary-fr">Résumé français</label><textarea id="article-summary-fr" maxlength="1000"></textarea></div>
        <div class="admin-field"><label for="article-summary-en">English summary</label><textarea id="article-summary-en" maxlength="1000"></textarea></div>
        <div class="admin-field"><label for="article-content-fr">Contenu français</label><textarea id="article-content-fr" required></textarea></div>
        <div class="admin-field"><label for="article-content-en">English content</label><textarea id="article-content-en"></textarea></div>
        <div class="admin-field">
          <label for="article-cover-file">Photo de couverture</label>
          <input id="article-cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <input id="article-cover-url" type="url" placeholder="URL actuelle" readonly>
        </div>
        <div class="admin-field">
          <label for="article-status">Publication</label>
          <select id="article-status"><option value="draft">Brouillon</option><option value="published">Publié</option></select>
          <label class="check-row"><input id="article-featured" type="checkbox"> À la une</label>
        </div>
        <div class="admin-actions full"><button class="admin-btn primary" type="submit">Enregistrer</button><button class="admin-btn" type="button" data-cancel-form="article-form">Annuler</button></div>
        <p id="article-message" class="admin-note full" role="status" aria-live="polite"></p>
      </form>

      <section id="article-photo-manager" class="admin-subpanel admin-hidden" aria-labelledby="article-photo-title">
        <h3 id="article-photo-title">Photos dans l’article</h3>
        <p class="admin-note">Enregistrez d’abord l’article, puis ajoutez plusieurs images. Maximum 10 Mo par image.</p>
        <form id="article-photo-form" class="admin-grid">
          <input type="hidden" id="article-photo-article-id">
          <div class="admin-field full"><label for="article-photo-files">Photos</label><input id="article-photo-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></div>
          <div class="admin-field"><label for="article-photo-caption-fr">Légende française</label><input id="article-photo-caption-fr" maxlength="300"></div>
          <div class="admin-field"><label for="article-photo-caption-en">English caption</label><input id="article-photo-caption-en" maxlength="300"></div>
          <div class="admin-field"><label for="article-photo-alt-fr">Texte alternatif français</label><input id="article-photo-alt-fr" maxlength="300"></div>
          <div class="admin-field"><label for="article-photo-alt-en">English alt text</label><input id="article-photo-alt-en" maxlength="300"></div>
          <div class="admin-actions full"><button class="admin-btn primary" type="submit">Ajouter les photos</button></div>
          <p id="article-photo-message" class="admin-note full" role="status" aria-live="polite"></p>
        </form>
        <div id="article-photo-list" class="admin-photo-list"></div>
      </section>
      <div id="article-list" class="admin-list"></div>
    </section>

    <section class="admin-panel admin-hidden" data-pane="events">
      <div class="admin-top"><h2>Événements</h2><button class="admin-btn primary" id="new-event" type="button">Nouvel événement</button></div>
      <form id="event-form" class="admin-grid admin-hidden">
        <input type="hidden" id="event-id">
        <div class="admin-field"><label>Titre français</label><input id="event-title-fr" maxlength="220" required></div>
        <div class="admin-field"><label>English title</label><input id="event-title-en" maxlength="220"></div>
        <div class="admin-field"><label>Slug</label><input id="event-slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></div>
        <div class="admin-field"><label>Statut</label><select id="event-status"><option value="draft">Brouillon</option><option value="published">Publié</option></select></div>
        <div class="admin-field"><label>Résumé français</label><textarea id="event-summary-fr"></textarea></div>
        <div class="admin-field"><label>English summary</label><textarea id="event-summary-en"></textarea></div>
        <div class="admin-field"><label>Description française</label><textarea id="event-description-fr"></textarea></div>
        <div class="admin-field"><label>English description</label><textarea id="event-description-en"></textarea></div>
        <div class="admin-field"><label>Cover image</label><input id="event-cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="event-cover-url" type="url" placeholder="URL actuelle" readonly></div>
        <div class="admin-field"><label class="check-row"><input id="event-featured" type="checkbox"> À la une</label></div>
        <div class="admin-actions full"><button class="admin-btn primary" type="submit">Enregistrer</button><button class="admin-btn" type="button" data-cancel-form="event-form">Annuler</button></div>
        <p id="event-message" class="admin-note full"></p>
      </form>
      <div id="event-list" class="admin-list"></div>
    </section>

    <section class="admin-panel admin-hidden" data-pane="editions">
      <div class="admin-top"><h2>Éditions et photos</h2><button class="admin-btn primary" id="new-edition" type="button">Nouvelle édition</button></div>
      <form id="edition-form" class="admin-grid admin-hidden">
        <input type="hidden" id="edition-id">
        <div class="admin-field"><label>Événement</label><select id="edition-event-id" required></select></div>
        <div class="admin-field"><label>Année</label><input id="edition-year" type="number" min="2000" max="2100"></div>
        <div class="admin-field"><label>Nom français</label><input id="edition-name-fr" required></div>
        <div class="admin-field"><label>English name</label><input id="edition-name-en"></div>
        <div class="admin-field"><label>Slug</label><input id="edition-slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></div>
        <div class="admin-field"><label>Statut</label><select id="edition-status"><option value="past">Passé</option><option value="upcoming">À venir</option><option value="active">Actif</option></select></div>
        <div class="admin-field"><label>Description française</label><textarea id="edition-description-fr"></textarea></div>
        <div class="admin-field"><label>English description</label><textarea id="edition-description-en"></textarea></div>
        <div class="admin-field"><label>Lieu</label><input id="edition-venue"></div>
        <div class="admin-field"><label>Ville</label><input id="edition-city"></div>
        <div class="admin-field"><label>Date</label><input id="edition-date" type="datetime-local"></div>
        <div class="admin-field"><label>Affiche</label><input id="edition-poster-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="edition-poster-url" type="url" placeholder="URL actuelle" readonly></div>
        <div class="admin-actions full"><button class="admin-btn primary" type="submit">Enregistrer</button><button class="admin-btn" type="button" data-cancel-form="edition-form">Annuler</button></div>
      </form>
      <div id="edition-list" class="admin-list"></div>
      <hr>
      <h3>Ajouter des photos à une édition</h3>
      <form id="photo-form" class="admin-grid">
        <div class="admin-field"><label>Édition</label><select id="photo-edition-id" required></select></div>
        <div class="admin-field"><label>Photos</label><input id="photo-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></div>
        <div class="admin-field"><label>Légende française</label><input id="photo-caption-fr"></div>
        <div class="admin-field"><label>English caption</label><input id="photo-caption-en"></div>
        <div class="admin-actions full"><button class="admin-btn primary" type="submit">Téléverser</button></div>
        <p id="photo-message" class="admin-note full"></p>
      </form>
    </section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
