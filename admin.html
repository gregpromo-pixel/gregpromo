<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Promo CMS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-page"><main class="admin-shell"><section id="auth-card" class="admin-login-card"><p class="eyebrow">Greg Promo CMS</p><h1>Administration</h1><p class="admin-note">Connectez-vous avec contact@gregpromoht.com. Lors de la première utilisation, créez le compte avec ce même courriel.</p><form id="auth-form" class="admin-grid"><div class="admin-field full"><label>Email</label><input id="auth-email" type="email" value="contact@gregpromoht.com" required></div><div class="admin-field full"><label>Mot de passe</label><input id="auth-password" type="password" minlength="8" required></div><div class="admin-actions full"><button class="admin-btn primary" type="submit">Connexion</button><button class="admin-btn" type="button" id="signup-btn">Créer le compte</button></div><p id="auth-message" class="admin-note full"></p></form></section><section id="dashboard" class="admin-hidden"><div class="admin-top"><div><p class="eyebrow">Greg Promo CMS</p><h1>Contenu du site</h1></div><button id="logout-btn" class="admin-btn">Déconnexion</button></div><div class="admin-tabs"><button class="admin-tab active" data-tab="articles">Articles</button><button class="admin-tab" data-tab="events">Événements</button><button class="admin-tab" data-tab="editions">Éditions & photos</button></div><section class="admin-panel" data-pane="articles"><div class="admin-top"><h2>Articles</h2><button class="admin-btn primary" id="new-article">Nouvel article</button></div><form id="article-form" class="admin-grid admin-hidden"><input type="hidden" id="article-id"><div class="admin-field"><label>Titre français</label><input id="article-title-fr" required></div><div class="admin-field"><label>English title</label><input id="article-title-en"></div><div class="admin-field"><label>Slug</label><input id="article-slug" required></div><div class="admin-field"><label>Catégorie</label><input id="article-category" value="culture"></div><div class="admin-field"><label>Résumé français</label><textarea id="article-summary-fr"></textarea></div><div class="admin-field"><label>English summary</label><textarea id="article-summary-en"></textarea></div><div class="admin-field"><label>Contenu français</label><textarea id="article-content-fr" required></textarea></div><div class="admin-field"><label>English content</label><textarea id="article-content-en"></textarea></div><div class="admin-field"><label>Photo de couverture</label><input id="article-cover-file" type="file" accept="image/*"><input id="article-cover-url" placeholder="URL actuelle"></div><div class="admin-field"><label>Publication</label><select id="article-status"><option value="draft">Brouillon</option><option value="published">Publié</option></select><label><input id="article-featured" type="checkbox"> À la une</label></div><div class="admin-actions full"><button class="admin-btn primary" type="submit">Enregistrer</button><button class="admin-btn" type="button" data-cancel-form="article-form">Annuler</button></div><p id="article-message" class="admin-note full"></p></form><div id="article-list" class="admin-list"></div></section><section class="admin-panel admin-hidden" data-pane="events"><div class="admin-top"><h2>Événements</h2><button class="admin-btn primary" id="new-event">Nouvel événement</button></div><form id="event-form" class="admin-grid admin-hidden"><input type="hidden" id="event-id"><div class="admin-field"><label>Titre français</label><input id="event-title-fr" required></div><div class="admin-field"><label>English title</label><input id="event-title-en"></div><div class="admin-field"><label>Slug</label><input id="event-slug" required></div><div class="admin-field"><label>Statut</label><select id="event-status"><option value="draft">Brouillon</option><option value="published">Publié</option></select></div><div class="admin-field"><label>Résumé français</label><textarea id="event-summary-fr"></textarea></div><div class="admin-field"><label>English summary</label><textarea id="event-summary-en"></textarea></div><div class="admin-field"><label>Description française</label><textarea id="event-description-fr"></textarea></div><div class="admin-field"><label>English description</label><textarea id="event-description-en"></textarea></div><div class="admin-field"><label>Cover image</label><input id="event-cover-file" type="file" accept="image/*"><input id="event-cover-url" placeholder="URL actuelle"></div><div class="admin-field"><label><input id="event-featured" type="checkbox"> À la une</label></div><div class="admin-actions full"><button class="admin-btn primary" type="submit">Enregistrer</button><button class="admin-btn" type="button" data-cancel-form="event-form">Annuler</button></div><p id="event-message" class="admin-note full"></p></form><div id="event-list" class="admin-list"></div></section><section class="admin-panel admin-hidden" data-pane="editions"><div class="admin-top"><h2>Éditions et photos</h2><button class="admin-btn primary" id="new-edition">Nouvelle édition</button></div><form id="edition-form" class="admin-grid admin-hidden"><input type="hidden" id="edition-id"><div class="admin-field"><label>Événement</label><select id="edition-event-id" required></select></div><div class="admin-field"><label>Année</label><input id="edition-year" type="number" min="2000" max="2100"></div><div class="admin-field"><label>Nom français</label><input id="edition-name-fr" required></div><div class="admin-field"><label>English name</label><input id="edition-name-en"></div><div class="admin-field"><label>Slug</label><input id="edition-slug" required></div><div class="admin-field"><label>Statut</label><select id="edition-status"><option value="past">Passé</option><option value="upcoming">À venir</option><option value="active">Actif</option></select></div><div class="admin-field"><label>Description française</label><textarea id="edition-description-fr"></textarea></div><div class="admin-field"><label>English description</label><textarea id="edition-description-en"></textarea></div><div class="admin-field"><label>Lieu</label><input id="edition-venue"></div><div class="admin-field"><label>Ville</label><input id="edition-city"></div><div class="admin-field"><label>Date</label><input id="edition-date" type="datetime-local"></div><div class="admin-field"><label>Affiche</label><input id="edition-poster-file" type="file" accept="image/*"><input id="edition-poster-url" placeholder="URL actuelle"></div><div class="admin-actions full"><button class="admin-btn primary" type="submit">Enregistrer</button><button class="admin-btn" type="button" data-cancel-form="edition-form">Annuler</button></div></form><div id="edition-list" class="admin-list"></div><hr><h3>Ajouter des photos à une édition</h3><form id="photo-form" class="admin-grid"><div class="admin-field"><label>Édition</label><select id="photo-edition-id" required></select></div><div class="admin-field"><label>Photos</label><input id="photo-files" type="file" accept="image/*" multiple required></div><div class="admin-field"><label>Légende française</label><input id="photo-caption-fr"></div><div class="admin-field"><label>English caption</label><input id="photo-caption-en"></div><div class="admin-actions full"><button class="admin-btn primary" type="submit">Téléverser</button></div><p id="photo-message" class="admin-note full"></p></form></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="site-data.js"></script><script src="admin.js"></script></body></html>
